<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="topicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
       refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
      </marker>
    </defs>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">
    Sync_Tooling ROS2 Architecture
  </text>
  
  <!-- Nebula LiDAR/Radar Driver Section -->
  <g id="sensors">
    <!-- Sensor icons -->
    <g transform="translate(80, 120)">
      <!-- LiDAR -->
      <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#sensorGrad)" filter="url(#dropshadow)"/>
      <text x="60" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LiDAR</text>
      <text x="60" y="45" text-anchor="middle" font-size="10" fill="white">Sensor</text>
      <circle cx="60" cy="60" r="8" fill="white" opacity="0.3"/>
      <circle cx="60" cy="60" r="4" fill="white"/>
    </g>
    
    <g transform="translate(80, 220)">
      <!-- Radar -->
      <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#sensorGrad)" filter="url(#dropshadow)"/>
      <text x="60" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Radar</text>
      <text x="60" y="45" text-anchor="middle" font-size="10" fill="white">Sensor</text>
      <path d="M 45 55 Q 60 45 75 55 Q 60 65 45 55" fill="white" opacity="0.6"/>
    </g>
    
    <!-- Driver Box -->
    <rect x="250" y="150" width="160" height="120" rx="12" fill="url(#sensorGrad)" filter="url(#dropshadow)"/>
    <text x="330" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Nebula Driver</text>
    <text x="330" y="200" text-anchor="middle" font-size="11" fill="white">LiDAR/Radar</text>
    <text x="330" y="215" text-anchor="middle" font-size="11" fill="white">Collection Metadata</text>
    <text x="330" y="240" text-anchor="middle" font-size="10" fill="white">Publishes to:</text>
    <text x="330" y="255" text-anchor="middle" font-size="9" fill="white">/sync_diag/graph_updates</text>
  </g>
  
  <!-- ECU Workers Section -->
  <g id="workers">
    <text x="100" y="400" font-size="16" font-weight="bold" fill="#374151">Distributed ECUs</text>
    
    <!-- ECU 1 -->
    <g transform="translate(80, 420)">
      <rect x="0" y="0" width="140" height="140" rx="10" fill="url(#workerGrad)" filter="url(#dropshadow)"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ECU 1</text>
      <text x="70" y="40" text-anchor="middle" font-size="10" fill="white">diag.worker</text>
      
      <!-- PMC monitoring -->
      <rect x="10" y="50" width="120" height="25" rx="4" fill="white" opacity="0.2"/>
      <text x="70" y="67" text-anchor="middle" font-size="9" fill="white">PMC → ptp4l monitor</text>
      
      <!-- Journal monitoring -->
      <rect x="10" y="80" width="120" height="25" rx="4" fill="white" opacity="0.2"/>
      <text x="70" y="97" text-anchor="middle" font-size="9" fill="white">Journal → phc2sys</text>
      
      <text x="70" y="120" text-anchor="middle" font-size="8" fill="white">Publishes updates</text>
    </g>
    
    <!-- ECU 2 -->
    <g transform="translate(240, 420)">
      <rect x="0" y="0" width="140" height="140" rx="10" fill="url(#workerGrad)" filter="url(#dropshadow)"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ECU 2</text>
      <text x="70" y="40" text-anchor="middle" font-size="10" fill="white">diag.worker</text>
      
      <rect x="10" y="50" width="120" height="25" rx="4" fill="white" opacity="0.2"/>
      <text x="70" y="67" text-anchor="middle" font-size="9" fill="white">PMC → ptp4l monitor</text>
      
      <rect x="10" y="80" width="120" height="25" rx="4" fill="white" opacity="0.2"/>
      <text x="70" y="97" text-anchor="middle" font-size="9" fill="white">Journal → phc2sys</text>
      
      <text x="70" y="120" text-anchor="middle" font-size="8" fill="white">Publishes updates</text>
    </g>
    
    <!-- ECU N -->
    <g transform="translate(400, 420)">
      <rect x="0" y="0" width="140" height="140" rx="10" fill="url(#workerGrad)" filter="url(#dropshadow)" opacity="0.7"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ECU N</text>
      <text x="70" y="40" text-anchor="middle" font-size="10" fill="white">diag.worker</text>
      <text x="70" y="70" text-anchor="middle" font-size="16" fill="white">...</text>
      <text x="70" y="120" text-anchor="middle" font-size="8" fill="white">More ECUs</text>
    </g>
  </g>
  
  <!-- Central Topic -->
  <g id="topic">
    <ellipse cx="600" cy="350" rx="180" ry="60" fill="url(#topicGrad)" filter="url(#dropshadow)"/>
    <text x="600" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="white">ROS Topic</text>
    <text x="600" y="360" text-anchor="middle" font-size="12" fill="white">/sync_diag/graph_updates</text>
    <text x="600" y="375" text-anchor="middle" font-size="10" fill="white">Message Aggregation</text>
  </g>
  
  <!-- Diag Master Section -->
  <g id="master">
    <rect x="850" y="120" width="280" height="220" rx="15" fill="url(#masterGrad)" filter="url(#dropshadow)"/>
    <text x="990" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="white">diag.master</text>
    
    <!-- Tree aggregation -->
    <rect x="870" y="170" width="240" height="40" rx="8" fill="white" opacity="0.2"/>
    <text x="990" y="185" text-anchor="middle" font-size="11" fill="white">Graph Updates Aggregation</text>
    <text x="990" y="200" text-anchor="middle" font-size="11" fill="white">→ Synchronization Tree</text>
    
    <!-- Web UI -->
    <rect x="870" y="220" width="240" height="110" rx="8" fill="white" opacity="0.3"/>
    <text x="990" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Web UI</text>
    <text x="990" y="255" text-anchor="middle" font-size="10" fill="white">Synchronization Tree</text>
    <text x="990" y="270" text-anchor="middle" font-size="10" fill="white">Visualization</text>
    
    <!-- Browser icon -->
    <rect x="970" y="280" width="40" height="40" rx="3" fill="white" opacity="0.8"/>
    <rect x="972" y="282" width="36" height="4" rx="2" fill="#dc2626"/>
    <circle cx="976" cy="284" r="1" fill="white"/>
    <circle cx="979" cy="284" r="1" fill="white"/>
    <circle cx="982" cy="284" r="1" fill="white"/>
  </g>
  
  <!-- Data Flow Arrows -->
  <!-- Sensors to Driver -->
  <path d="M 200 180 Q 220 180 240 190" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 200 260 Q 220 240 240 220" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Driver to Topic -->
  <path d="M 410 210 Q 440 210 450 320" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="270" font-size="10" fill="#374151">Sensor PTP</text>
  
  <!-- Workers to Topic -->
  <path d="M 150 420 Q 300 380 420 360" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 420 Q 400 390 420 370" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 470 420 Q 410 420 440 380" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <text x="300" y="395" font-size="10" fill="#374151">ECU PTP4L</text>
  
  <!-- Topic to Master -->
  <path d="M 780 350 Q 820 280 850 220" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="800" y="290" font-size="10" fill="#374151">aggregated updates</text>
  
  <!-- Legend -->
  <g id="legend" transform="translate(850, 400)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#dropshadow)"/>
    <text x="140" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">System Components</text>
    
    <rect x="15" y="30" width="15" height="10" fill="url(#sensorGrad)"/>
    <text x="35" y="39" font-size="10" fill="#374151">Sensor Drivers</text>
    
    <rect x="15" y="50" width="15" height="10" fill="url(#workerGrad)"/>
    <text x="35" y="59" font-size="10" fill="#374151">ECU Workers (diag.worker)</text>
    
    <rect x="15" y="70" width="15" height="10" fill="url(#masterGrad)"/>
    <text x="35" y="79" font-size="10" fill="#374151">Master Controller (diag.master)</text>
    
    <ellipse cx="22" cy="95" rx="8" ry="5" fill="url(#topicGrad)"/>
    <text x="35" y="99" font-size="10" fill="#374151">ROS Topic Communication</text>
  </g>
  
  <!-- Data flow indicators -->
  <g id="flow-indicators">
    <!-- Animated dots for data flow -->
    <circle cx="450" cy="280" r="3" fill="#6366f1" opacity="0.8">
      <animate attributeName="cx" values="450;500;550;600" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="350" cy="380" r="3" fill="#059669" opacity="0.8">
      <animate attributeName="cx" values="350;400;450;500" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="750" cy="320" r="3" fill="#dc2626" opacity="0.8">
      <animate attributeName="cx" values="750;800;850" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>