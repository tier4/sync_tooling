[project]
name = "ros2-transport"
version = "0.2.2"
description = "A transport layer using ROS 2 pub/sub"
authors = [{ name = "Max SCHMELLER", email = "max.schmeller@tier4.jp" }]
requires-python = ">=3.10"
dependencies = [
    "sync-tooling-msgs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ros2_transport"]

[tool.uv.sources]
sync-tooling-msgs = { workspace = true }

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[dependency-groups]
dev = []
