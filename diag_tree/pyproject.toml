[project]
name = "diag_tree"
version = "0.1.0"
description = "A framework for diagnosing tree-structured systems."
authors = [
    { name = "Max Schmeller", email = "max.schmeller@tier4.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "sync_tooling_msgs"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diag_tree"]
