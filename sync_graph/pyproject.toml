[project]
name = "sync-graph"
version = "0.2.0"
description = "A graph representing the clocks and synchronization mechanisms of a distributed time-aware system."
readme = "README.md"
authors = [
    { name = "Max SCHMELLER", email = "max.schmeller@tier4.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_graph"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
