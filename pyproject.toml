[project]
name = "sync_tooling"
description = "Tool suite to monitor and diagnose sensor and ECU synchronization"
version = "0.1.0"
authors = [{ name = "Max Schmeller", email = "max.schmeller@tier4.jp" }]
requires-python = ">=3.10"
dependencies = [
    "bottleneck>=1.3.6",
    "numexpr>=2.8.4",
    "numpy<2"
]

[tool.uv.sources]
journal_monitor = { workspace = true }
linuxptp_monitor = { workspace = true }
pmc_monitor = { workspace = true }
diag_tree = { workspace = true }
diag_worker = { workspace = true }
diag_master = { workspace = true }
sync_graph = { workspace = true }

[tool.uv.workspace]
members = ["journal_monitor", "linuxptp_monitor", "pmc_monitor", "diag_tree", "diag_worker", "diag_master", "sync_graph", "ros2_transport"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["journal_monitor", "linuxptp_monitor", "pmc_monitor", "diag_tree", "diag_worker", "diag_master", "sync_graph", "ros2_transport"]
