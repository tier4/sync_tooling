[project]
name = "journal_monitor"
version = "0.2.0"
description = "A package for retrieving logs from the systemd journal."
authors = [{ name = "Max Schmeller", email = "max.schmeller@tier4.jp" }]
dependencies = [
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_monitor"]
