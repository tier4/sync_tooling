[project]
name = "linuxptp_monitor"
version = "0.1.0"
description = "A package for interpreting LinuxPTP (PTP4L and PHC2SYS) journal output."
authors = [{ name = "Max Schmeller", email = "max.schmeller@tier4.jp" }]
dependencies = [
    "journal_monitor",
 "diag_tree",
 "sync-tooling-msgs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linuxptp_monitor"]

[tool.uv.sources]
sync-tooling-msgs = { workspace = true }
