[project]
name = "pmc_monitor"
version = "0.2.1"
description = "A package for monitoring local and remote PTP nodes by implementing a PTP Management Client."
authors = [{ name = "Max Schmeller", email = "max.schmeller@tier4.jp" }]
dependencies = ["pandas>=2.2.3", "pytest>=8.3.4", "tabulate>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmc_monitor"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
