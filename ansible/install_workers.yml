    - name: Install sync tooling
      block:
        - name: Install wheel's requirements
          ansible.builtin.shell:
            cmd: . {{ venv_path }}/bin/activate && pip install -r /tmp/requirements.txt
          become: true

        - name: Install the wheel file
          ansible.builtin.shell:
            cmd: . {{ venv_path }}/bin/activate && pip install --force-reinstall /tmp/{{ hostvars['localhost'].wheel_path | basename }}
          become: true

    - name: Configure run script
      ansible.builtin.template:
        src: templates/run_with_sync_tooling_context.sh.j2
        dest: "{{ run_script_path }}"
        group: root
        owner: root
        mode: 0755
      become: true

    - name: Configure systemd services
      block:
        - name: Copy Reference Graph
          ansible.builtin.copy:
            src: "{{ sync_master.reference }}"
            dest: /opt/sync_diagnostics/reference.yml
            group: root
            owner: root
            mode: 0444
          when: sync_master is defined and sync_master.reference is defined
          become: true

        - name: Install Sync Diagnostcs Master
          ansible.builtin.template:
            src: templates/sync_diag_master.service.j2
            dest: /etc/systemd/system/sync_diag_master.service
            group: root
            owner: root 
            mode: 0644
          when: sync_master is defined
          register: install_sync_master
          become: true

        - name: Install Sync Diagnostcs Worker
          ansible.builtin.template:
            src: templates/sync_diag_worker.service.j2
            dest: /etc/systemd/system/sync_diag_worker.service
            group: root
            owner: root 
            mode: 0644
          when: sync_worker is defined
          register: install_sync_worker
          become: true

        - name: Reload systemd daemon
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: (install_sync_worker is changed) or (install_sync_master is changed)
          become: true

        - name: Enable and run master
          ansible.builtin.systemd_service:
            name: sync_diag_master
            enabled: true
            state: restarted
          when: not (install_sync_master is skipped)
          become: true

        - name: Enable and run worker
          ansible.builtin.systemd_service:
            name: sync_diag_worker
            enabled: true
            state: restarted
          when: not (install_sync_worker is skipped)
          become: true
